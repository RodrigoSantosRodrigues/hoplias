[program:hoplias-api-service]
command=bash -c 'exec /usr/local/bin/uvicorn run:app --workers 4 --host 0.0.0.0 --port ${API_PORT:-8005} --access-log'
directory=/app/api-service
user=root
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/api-service.log
stderr_logfile=/var/log/supervisor/api-service_error.log
environment=ENV="${ENV}",FLASK_ENV="${FLASK_ENV}",APP_HOST="${APP_HOST}",APP_PORT="${APP_PORT}",JWT_SIGNATURE_TOKEN="${JWT_SIGNATURE_TOKEN}",JWT_SECRET_KEY="${JWT_SECRET_KEY}",RPC_GATEWAY_KEY="${RPC_GATEWAY_KEY}",CHATBOT_SECRET_KEY="${CHATBOT_SECRET_KEY}",IP_HOST="${IP_HOST}",HTTPS="${HTTPS}",ALLOWED_IP_HOST="${ALLOWED_IP_HOST}",DESKTOP_MODE_AUTH="${DESKTOP_MODE_AUTH}",HOST_DOCUMENTS_DIR="${HOST_DOCUMENTS_DIR}",DB_USER="${DB_USER}",DB_PW="${DB_PW}",DB_PASSWORD="${DB_PASSWORD}",DB_HOST="${DB_HOST}",DB_PORT="${DB_PORT}",DB_NAME="${DB_NAME}",DB_API="${DB_API}",DATABASE_URL="${DATABASE_URL}",AWS_REGION="${AWS_REGION}",AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}",AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}",MAIL_SERVER="${MAIL_SERVER}",MAIL_PORT="${MAIL_PORT}",MAIL_USERNAME="${MAIL_USERNAME}",MAIL_FROM="${MAIL_FROM}",MAIL_PASSWORD="${MAIL_PASSWORD}",RECOVER_CODE_EXPIRATION_DAYS="${RECOVER_CODE_EXPIRATION_DAYS}",APP_PLATFORM_HOST="${APP_PLATFORM_HOST}",BASE_URL_API_GATEWAY="${BASE_URL_API_GATEWAY}",BASE_URL_API_AI="${BASE_URL_API_AI}",REACT_APP_API_SERVICE="${REACT_APP_API_SERVICE}",REACT_APP_AI_SERVICE="${REACT_APP_AI_SERVICE}",AI_GPT_API_KEY="${AI_GPT_API_KEY}",GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}",GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}",GOOGLE_REDIRECT_URI="${GOOGLE_REDIRECT_URI}",GCP_PROJECT_ID="${GCP_PROJECT_ID}",GCP_PRIVATE_KEY_ID="${GCP_PRIVATE_KEY_ID}",GCP_PRIVATE_KEY="${GCP_PRIVATE_KEY}",GCP_CLIENT_EMAIL="${GCP_CLIENT_EMAIL}",GCP_CLIENT_ID="${GCP_CLIENT_ID}",GCP_CERT_URL="${GCP_CERT_URL}",TOKEN_EXPIRES_IN="${TOKEN_EXPIRES_IN}",MAX_CONCURRENT_IO_LOAD_IMAGES="${MAX_CONCURRENT_IO_LOAD_IMAGES}",REDIS_URL="${REDIS_URL}",REDIS_PASSWORD="${REDIS_PASSWORD}",GRAYLOG_HOST="${GRAYLOG_HOST}",GRAYLOG_PORT_UDP="${GRAYLOG_PORT_UDP}",GRAYLOG_ROOT_USERNAME="${GRAYLOG_ROOT_USERNAME}",GRAYLOG_PASSWORD="${GRAYLOG_PASSWORD}",GRAYLOG_PASSWORD_SHA="${GRAYLOG_PASSWORD_SHA}",GRAYLOG_HTTP_EXTERNAL_URI="${GRAYLOG_HTTP_EXTERNAL_URI}",GRAYLOG_HTTP_CORS_ALLOW_ORIGIN="${GRAYLOG_HTTP_CORS_ALLOW_ORIGIN}",HOST_MQ="${HOST_MQ}",PORT_MQ="${PORT_MQ}",USER_MQ="${USER_MQ}",PASSWORD_MQ="${PASSWORD_MQ}",SECRET_SQLBAK="${SECRET_SQLBAK}",DEBUG="1",LOGLEVEL="DEBUG"
priority=200

