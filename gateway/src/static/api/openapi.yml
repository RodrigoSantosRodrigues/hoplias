                      opacity: 
                        type: "number"
                      originX: 
                        type: "string"
                      originY: 
                        type: "string"
                      paintFirst: 
                        type: "string"
                      scaleX: 
                        type: "number"
                      scaleY: 
                        type: "number"
                      skewX: 
                        type: "number"
                      skewY: 
                        type: "number"
                      src: 
                        type: "string"
                      strokeDashOffset: 
                        type: "number"
                      strokeLineCap: 
                        type: "string"
                      strokeLineJoin: 
                        type: "string"
                      strokeMiterLimit: 
                        type: "number"
                      strokeWidth: 
                        type: "number"
                      tooltip: 
                        required: 
                          - "enabled"
                        properties: 
                          enabled: 
                            type: "boolean"
                        type: "object"
                      top: 
                        type: "number"
                      type: 
                        type: "string"
                      version: 
                        type: "string"
                      visible: 
                        type: "boolean"
                      width: 
                        type: "number"
                      workareaHeight: 
                        type: "number"
                      workareaWidth: 
                        type: "number"
                      animation: 
                        required: 
                          - "autoplay"
                          - "delay"
                          - "duration"
                          - "loop"
                          - "type"
                        properties: 
                          autoplay: 
                            type: "boolean"
                          delay: 
                            type: "number"
                          duration: 
                            type: "number"
                          loop: 
                            type: "boolean"
                          type: 
                            type: "string"
                        type: "object"
                      editable: 
                        type: "boolean"
                      points: 
                        type: "array"
                        items: 
                          type: "object"
                          properties: 
                            x: 
                              type: "number"
                            y: 
                              type: "number"
                      trigger: 
                        required: 
                          - "effect"
                          - "enabled"
                          - "script"
                          - "type"
                        properties: 
                          effect: 
                            type: "string"
                          enabled: 
                            type: "boolean"
                          script: 
                            type: "string"
                          type: 
                            type: "string"
                        type: "object"
                      userProperty: 
                        required: []
                        properties: {}
                        type: "object"
      responses:
        '200':
          description: Centromere search successfully 
        '500':
          description: Gateway internal error
        '501':
          description: Service internal error
tags:
  - name: Account
    description: Create account
  - name: Entity
    description: Create entity
  - name: Profile
    description: Create profile
  - name: Address
    description: Create Address
  - name: Segmentation
    description: Segmentation metaphases  
  - name: Classification
    description: Classifying metaphases  
