networks:
  custom_network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  mongo_data_api:
  vue-client:
  grafana_data:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_db:
  letsencrypt:
  sqlbak_volume:
  rabbitmq_data:
  redis_data:
  redisinsight_data:
  ollama_data:
  
