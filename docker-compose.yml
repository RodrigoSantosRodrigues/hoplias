services:
  portainer:
    container_name: portainer
    image: portainer/portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "9000:9000"
    networks:
      - custom_network
    restart: unless-stopped

  hoplias-rabbitmq:
    image: rabbitmq:3-management
    container_name: hoplias-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBIT_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
      - "25676:25676"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - custom_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "512M"
        reservations:
          cpus: "0.15"
          memory: "156M"

  hoplias-redis:
    image: redis:7-alpine
    container_name: hoplias-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - custom_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "512M"
        reservations:
          cpus: "0.15"
          memory: "156M"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  hoplias-gateway:
    container_name: hoplias-gateway
    image: python:3.9
    build:
      context: ./gateway
      dockerfile: Dockerfile
    volumes:
      - ./gateway:/app
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "800M"
    environment:
      - DEBUG=1
      - LOGLEVEL=DEBUG
      - HOST_MQ=hoplias-rabbitmq
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT_UDP=12201
    depends_on:
      - hoplias-rabbitmq
      - prometheus
    networks:
      - custom_network
    command: bash -c 'while !</dev/tcp/hoplias-rabbitmq/5672; do sleep 1; done; watchmedo auto-restart --recursive --patterns="*.py" -- gunicorn -w 4 -b 0.0.0.0:8001 --timeout 120 "run:app" --access-logfile -'

  hoplias-api-service:
    container_name: hoplias-api-service
    image: python:3.9
    build:
      context: ./api-service
      dockerfile: Dockerfile
    volumes:
      - ./api-service/:/app
      - ${HOST_DOCUMENTS_DIR}:/app/local_storage
    restart: unless-stopped
    ports:
      - "8005:8005"
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "0.7"
          memory: "700M"
    environment:
      - DEBUG=1
      - LOGLEVEL=DEBUG
      - DB_HOST=hoplias-api-service-mongo
      - DATABASE_URL=mongodb://$DB_USER:$DB_PASSWORD@hoplias-api-service-mongo:27017/${DB_API}?authSource=admin
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT_UDP=12201
      - REDIS_URL=redis://hoplias-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - hoplias-api-service-mongo
    networks:
      - custom_network
    command: bash -c 'while !</dev/tcp/hoplias-api-service-mongo/27017; do sleep 1; done; watchmedo auto-restart --recursive --patterns="*.py" -- uvicorn run:app --workers 2 --host 0.0.0.0 --port 8005 --access-log'

  hoplias-segmentation:
    container_name: hoplias-segmentation
    image: python:3.9
    build:
      context: ./segmentation
      dockerfile: Dockerfile
    volumes:
      - ./segmentation/:/app
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - DEBUG=1
      - LOGLEVEL=DEBUG
      - RABBIT_HOST=hoplias-rabbitmq
      - RABBIT_PORT=5672
      - RABBIT_MANAGEMENT_PORT=15672
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT_UDP=12201
    env_file:
      - .env
    depends_on:
      - prometheus
      - hoplias-rabbitmq
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    networks:
      - custom_network
    command: bash -c 'while !</dev/tcp/hoplias-rabbitmq/5672; do sleep 1; done; watchmedo auto-restart --pattern="*.py" --recursive -- nameko run --config config.yml src.service'

  hoplias-classification:
    container_name: hoplias-classification
    image: python:3.9
    build:
      context: ./classification
      dockerfile: Dockerfile
    volumes:
      - ./classification:/app
      - ${HOST_DOCUMENTS_DIR}:/app/local_storage
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - DEBUG=1
      - LOGLEVEL=DEBUG
      - RABBIT_HOST=hoplias-rabbitmq
      - RABBIT_PORT=5672
      - RABBIT_MANAGEMENT_PORT=15672
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT_UDP=12201
      - MONGO_URI=mongodb://$DB_USER:$DB_PASSWORD@hoplias-api-service-mongo:27017/${DB_API}?authSource=admin
      - MONGO_DB_NAME= ${DB_API}
      - REDIS_URL=redis://hoplias-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    depends_on:
      - prometheus
      - hoplias-rabbitmq
    networks:
      - custom_network
    command: bash -c 'while !</dev/tcp/hoplias-rabbitmq/5672; do sleep 1; done; watchmedo auto-restart --pattern="*.py" --recursive -- nameko run --config config.yml src.service'
  
  hoplias-ideogram:
    container_name: hoplias-ideogram
    image: python:3.9
    build:
      context: ./ideogram
      dockerfile: Dockerfile
    volumes:
      - ./ideogram:/app
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      - DEBUG=1
      - LOGLEVEL=DEBUG
      - RABBIT_HOST=hoplias-rabbitmq
      - RABBIT_PORT=5672
      - RABBIT_MANAGEMENT_PORT=15672
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT_UDP=12201
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "500M"
    depends_on:
      - prometheus
      - hoplias-rabbitmq
    networks:
      - custom_network
    command: bash -c 'while !</dev/tcp/hoplias-rabbitmq/5672; do sleep 1; done; watchmedo auto-restart --pattern="*.py" --recursive -- nameko run --config config.yml src.service'

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    ports:
      - "9090:9090"
    networks:
      - custom_network
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "300M"

  grafana:
    container_name: grafana
    image: grafana/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - custom_network
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "300M"

  hoplias-api-service-mongo:
    image: mongo:5.0
    container_name: hoplias-api-service-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_api:/data/db
    networks:
      - custom_network
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_API}
    command: ["mongod", "--bind_ip_all", "--auth"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  mongo:
    container_name: api-service-mongo
    image: mongo:3
    networks:
      - custom_network
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  elasticsearch:
    container_name: api-service-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:6.8.10
    environment:
      - http.host=0.0.0.0
      - transport.host=localhost
      - network.host=0.0.0.0
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - custom_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  graylog:
    container_name: graylog
    image: graylog/graylog:4.3
    environment:
      - GRAYLOG_ROOT_USERNAME=${GRAYLOG_ROOT_USERNAME}
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_PASSWORD}
      - GRAYLOG_ROOT_PASSWORD_SHA2=${GRAYLOG_PASSWORD_SHA}
      - GRAYLOG_HTTP_EXTERNAL_URI=${GRAYLOG_HTTP_EXTERNAL_URI}
      - GRAYLOG_HTTP_ENABLE_CORS=true
      - GRAYLOG_HTTP_CORS_ALLOW_ORIGIN=${GRAYLOG_HTTP_CORS_ALLOW_ORIGIN}
      - GRAYLOG_HTTP_BIND_ADDRESS=graylog:9001
    depends_on:
      - mongo
      - elasticsearch
    restart: unless-stopped
    ports:
      # Graylog web interface and REST API
      - 9001:9001
      # Syslog TCP
      - 1514:1514
      # Syslog UDP
      - 1514:1514/udp
      # GELF TCP
      - 12201:12201
      # GELF UDP
      - 12201:12201/udp
    networks:
      - custom_network
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "400M"

  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: config/nginx.Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config:/config
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /tmp/acme_challenge:/tmp/acme_challenge
    restart: unless-stopped
    networks:
      - custom_network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

networks:
  custom_network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  mongo_data_api:
  vue-client:
  grafana_data:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_db:
  letsencrypt:
  sqlbak_volume:
  rabbitmq_data:
  redis_data:
  redisinsight_data:
