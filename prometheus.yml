# Global configuration settings for Prometheus
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# Alerting configuration for Prometheus
alerting:
  alertmanagers:
    - follow_redirects: true
      enable_http2: true
      scheme: http
      timeout: 10s
      api_version: v2
      static_configs:
        - targets: []

# Scrape configurations for Prometheus, defining jobs and their settings
scrape_configs:
  # Job configuration for 'api-service'
  - job_name: 'api_service_job'
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
        - 'hoplias-api-service:8005'
