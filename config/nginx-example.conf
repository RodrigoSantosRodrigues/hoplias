
upstream hoplias-api {
  server hoplias-api-service:8005 max_fails=10 fail_timeout=5s;
}

upstream conect-grafana {
  server grafana:3000;
}

upstream conect-graylog {
  server graylog:9001;
}

upstream conect-portainer {
  server portainer:9000;
}

upstream rabbitmq {
  server hoplias-rabbitmq:15672;
}

server {
  listen 80;
  listen [::]:80;

  location /api/ {
    proxy_pass http://hoplias-api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /api;
    client_max_body_size 20M;
    proxy_intercept_errors off;
    proxy_redirect off;

    add_header X-Upstream-Address $upstream_addr;
    add_header X-Upstream-Status $upstream_status;
  }

  location /portainer/ {
    proxy_pass http://conect-portainer/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /portainer;
  }

  location /rabbitmq/ {
    proxy_pass http://rabbitmq/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /rabbitmq;
  }

  location /grafana/ {
    proxy_pass http://conect-grafana/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /grafana;

    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Credentials' 'true';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';

    proxy_pass_header Set-Cookie;
    rewrite ^/grafana/(.*) /$1 break;
    proxy_redirect http://conect-grafana/ /grafana/;
  }

  location /graylog/ {
    proxy_pass http://conect-graylog/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Graylog-Server-URL http://$server_name/graylog/;
    proxy_set_header X-Forwarded-Prefix /graylog;
  }

  location / {
    return 502 "";
    add_header Content-Type text/plain;
  }
}
